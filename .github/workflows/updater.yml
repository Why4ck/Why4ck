name: Dynamic Readme Updater

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: python updater.py
      - run: |
          git config user.name "why4ck-bot"
          git config user.email "bot@why4ck.com"
          git commit -am "auto: update status" || exit 0
          git push